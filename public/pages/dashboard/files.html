<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>My Files — Nexus Security</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../../css/styles.css">
<link rel="manifest" href="../../manifest.json">
<meta name="theme-color" content="#0e9a86">
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>
<div class="scan-line"></div>
<canvas id="bgCanvas" style="position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.7"></canvas>

<!-- NAV -->
<nav>
  <div class="nav-logo">NEXUS<span>SEC</span></div>
  <div class="nav-links">
    <button onclick="showPage('home')" id="nav-home">Home</button>
    <button onclick="showPage('about')" id="nav-about">About</button>
    <button onclick="showPage('faq')" id="nav-faq">FAQ</button>
    <button onclick="showPage('pricing')" id="nav-pricing">Pricing</button>
    <button onclick="showPage('contact')" id="nav-contact">Contact</button>
    <button onclick="showPage('login')" id="nav-login" style="color:#33302b;border:1px solid #e2d9ca;border-radius:4px;margin-left:8px">Client Login</button>
  </div>
  <button class="nav-hamburger" id="navHamburger" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>
</nav>
<div class="nav-mobile-menu" id="navMobileMenu">
  <button onclick="window.location.href='/'">Home</button>
  <button onclick="window.location.href='/pages/about.html'">About</button>
  <button onclick="window.location.href='/pages/faq.html'">FAQ</button>
  <button onclick="window.location.href='/pages/pricing.html'">Pricing</button>
  <button onclick="window.location.href='/pages/contact.html'">Contact</button>
  <button class="nav-mobile-login" onclick="window.location.href='/pages/login.html'">Client Login</button>
</div>

<div class="page active" id="page-dash-files">
  <div class="dash-layout">
    <div class="dash-sidebar" id="sb-files"></div>
    <div class="dash-main">
      <div id="dash-tabs"></div>
      <div class="dash-header"><div class="dash-greeting">File Manager</div><div class="dash-date" id="fileCount">0 files</div></div>
      <!-- Drag-and-drop zone -->
      <div class="drop-zone" id="dropZone" onclick="document.getElementById('uploadInput').click()">
        <span class="drop-zone-icon">☁️</span>
        <div class="drop-zone-text">Drag files here or click to upload</div>
        <div class="drop-zone-sub">PDF · DOC · XLS · JPG · PNG · ZIP — max 100 MB</div>
        <input type="file" id="uploadInput" multiple>
      </div>
      <div class="upload-progress-wrap">
        <div class="upload-progress-bar"><div class="upload-progress-fill"></div></div>
        <div class="upload-progress-label"></div>
      </div>

      <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center">
        <input type="text" id="fileSearch" placeholder="Search files…" oninput="filterFiles()" style="flex:1;min-width:180px;background:#ffffff;border:1px solid #ebe3d7;border-radius:8px;padding:11px 16px;color:#2b2723;font-family:'DM Sans',sans-serif;font-size:14px;outline:none"/>
        <select id="folderFilter" onchange="onFolderChange()" style="background:#ffffff;border:1px solid #ebe3d7;border-radius:8px;padding:11px 14px;color:#8a8074;font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:1px;outline:none;cursor:pointer">
          <option value="">All Folders</option>
          <option value="root">No Folder</option>
        </select>
        <button onclick="createFolder()" title="New folder" style="background:#ffffff;border:1px solid #ebe3d7;border-radius:8px;padding:11px 16px;color:#14b39c;font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:2px;cursor:pointer;white-space:nowrap">＋ FOLDER</button>
        <button id="trashToggleBtn" onclick="toggleTrash()" style="background:#ffffff;border:1px solid #ebe3d7;border-radius:8px;padding:11px 16px;color:#33302b;font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:2px;cursor:pointer;white-space:nowrap">🗑 TRASH</button>
        <button onclick="exportFilesZip()" style="background:#ffffff;border:1px solid #ebe3d7;border-radius:8px;padding:11px 18px;color:#33302b;font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:2px;cursor:pointer;white-space:nowrap">⬇ EXPORT ZIP</button>
      </div>
      <div id="folderActions" style="display:none;margin:-6px 0 14px;font-size:12px;color:#948a7d"></div>
      <div id="bulkBar" style="display:none;align-items:center;gap:12px;flex-wrap:wrap;background:rgba(14,154,134,0.07);border:1px solid rgba(14,154,134,0.25);border-radius:10px;padding:10px 16px;margin-bottom:14px">
        <span id="bulkCount" style="font-size:13px;color:#33302b;font-weight:500">0 selected</span>
        <select id="bulkFolder" style="background:#f5efe7;border:1px solid #eee7dc;border-radius:6px;padding:7px 10px;color:#8a8074;font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:1px;cursor:pointer"></select>
        <button onclick="bulkMove()" style="background:#f5efe7;border:1px solid #eee7dc;border-radius:6px;padding:7px 14px;color:#14b39c;font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:1px;cursor:pointer">MOVE</button>
        <button onclick="bulkDelete()" style="background:#f5efe7;border:1px solid #eee7dc;border-radius:6px;padding:7px 14px;color:#f87171;font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:1px;cursor:pointer">DELETE</button>
        <button onclick="clearSelection()" style="background:none;border:none;color:#948a7d;font-size:12px;cursor:pointer;text-decoration:underline;margin-left:auto">Clear</button>
      </div>
      <div class="activity-feed" id="fileList"></div>
      <div id="emptyFiles" style="display:none;text-align:center;padding:48px 20px;color:#948a7d;font-size:14px">No files match your search.</div>
    </div>
  </div>
</div>

<!-- Toast notification -->
<div id="toast" style="display:none;position:fixed;bottom:32px;right:32px;background:#ffffff;border:1px solid #ebe3d7;border-radius:10px;padding:14px 20px;font-size:13px;color:#33302b;z-index:9999;box-shadow:0 8px 30px rgba(60,50,35,0.10);font-family:'DM Sans',sans-serif;max-width:320px;animation:fadeUp 0.3s ease"></div>

<script src="../../js/script.js"></script>
<script>document.addEventListener('DOMContentLoaded', initDashboard);</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('../../sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
