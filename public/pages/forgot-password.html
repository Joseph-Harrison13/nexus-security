<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Forgot Password — Nexus Security</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../css/styles.css">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#0e9a86">
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>
<div class="scan-line"></div>
<canvas id="bgCanvas" style="position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.7"></canvas>

<nav>
  <div class="nav-logo">NEXUS<span>SEC</span></div>
  <div class="nav-links">
    <button onclick="showPage('home')" id="nav-home">Home</button>
    <button onclick="showPage('about')" id="nav-about">About</button>
    <button onclick="showPage('faq')" id="nav-faq">FAQ</button>
    <button onclick="showPage('pricing')" id="nav-pricing">Pricing</button>
    <button onclick="showPage('contact')" id="nav-contact">Contact</button>
    <button onclick="showPage('login')" id="nav-login" style="color:#33302b;border:1px solid #e2d9ca;border-radius:4px;margin-left:8px">Client Login</button>
  </div>
  <button class="nav-hamburger" id="navHamburger" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>
</nav>
<div class="nav-mobile-menu" id="navMobileMenu">
  <button onclick="window.location.href='/'">Home</button>
  <button onclick="window.location.href='/pages/about.html'">About</button>
  <button onclick="window.location.href='/pages/faq.html'">FAQ</button>
  <button onclick="window.location.href='/pages/pricing.html'">Pricing</button>
  <button onclick="window.location.href='/pages/contact.html'">Contact</button>
  <button class="nav-mobile-login" onclick="window.location.href='/pages/login.html'">Client Login</button>
</div>

<div class="page active">
  <div class="login-wrap">
    <div class="login-box">

      <div id="stepRequest">
        <div class="login-logo">NEXUS<span>SEC</span></div>
        <div class="login-title">Forgot Password</div>
        <div class="login-sub">Enter your email and we'll send you a reset link.</div>

        <div class="form-group" style="margin-top:28px">
          <label>Email Address</label>
          <input id="forgotEmail" type="email" placeholder="you@yourbusiness.com" autocomplete="email" />
        </div>

        <div id="forgotError" style="display:none;background:rgba(201,126,126,0.08);border:1px solid rgba(201,126,126,0.2);border-radius:8px;padding:12px 16px;font-size:13px;color:#c97e7e;margin-bottom:16px"></div>

        <button class="login-btn" onclick="handleForgotPassword()" style="margin-top:8px">Send Reset Link →</button>

        <div style="text-align:center;margin-top:20px">
          <button onclick="showPage('login')" style="background:none;border:none;color:#8a8074;font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:1px;cursor:pointer">← Back to Login</button>
        </div>
      </div>

      <div id="stepSent" style="display:none;text-align:center">
        <div style="font-size:48px;margin-bottom:16px">📧</div>
        <div class="login-title">Check Your Email</div>
        <div class="login-sub" style="margin-top:8px">If that email is in our system, a reset link is on its way. The link expires in 15 minutes.</div>
        <button onclick="showPage('login')" class="btn-outline" style="margin-top:28px;width:100%">← Back to Login</button>
      </div>

    </div>
  </div>
</div>

<div id="toast" style="display:none;position:fixed;bottom:32px;right:32px;background:#ffffff;border:1px solid #ebe3d7;border-radius:10px;padding:14px 20px;font-size:13px;color:#33302b;z-index:9999;box-shadow:0 8px 30px rgba(60,50,35,0.10);font-family:'DM Sans',sans-serif;max-width:320px;animation:fadeUp 0.3s ease"></div>

<script src="../js/script.js"></script>
<script>
async function handleForgotPassword() {
  const email   = document.getElementById('forgotEmail').value.trim();
  const errEl   = document.getElementById('forgotError');
  errEl.style.display = 'none';

  if (!email) {
    errEl.textContent = 'Please enter your email address.';
    errEl.style.display = 'block';
    return;
  }

  const btn = document.querySelector('.login-btn');
  btn.textContent = 'Sending…'; btn.disabled = true;

  try {
    const res  = await fetch('/api/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });
    await res.json();
    document.getElementById('stepRequest').style.display = 'none';
    document.getElementById('stepSent').style.display    = 'block';
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  } finally {
    btn.textContent = 'Send Reset Link →'; btn.disabled = false;
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') handleForgotPassword();
});
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('../sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
