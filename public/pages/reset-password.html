<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Reset Password — Nexus Security</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../css/styles.css">
<link rel="manifest" href="../manifest.json">
<meta name="theme-color" content="#0e9a86">
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>
<div class="scan-line"></div>
<canvas id="bgCanvas" style="position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0.7"></canvas>

<nav>
  <div class="nav-logo">NEXUS<span>SEC</span></div>
  <div class="nav-links">
    <button onclick="showPage('home')" id="nav-home">Home</button>
    <button onclick="showPage('login')" id="nav-login" style="color:#33302b;border:1px solid #e2d9ca;border-radius:4px;margin-left:8px">Client Login</button>
  </div>
  <button class="nav-hamburger" id="navHamburger" aria-label="Open menu">
    <span></span><span></span><span></span>
  </button>
</nav>
<div class="nav-mobile-menu" id="navMobileMenu">
  <button onclick="window.location.href='/'">Home</button>
  <button onclick="window.location.href='/pages/about.html'">About</button>
  <button onclick="window.location.href='/pages/faq.html'">FAQ</button>
  <button onclick="window.location.href='/pages/pricing.html'">Pricing</button>
  <button onclick="window.location.href='/pages/contact.html'">Contact</button>
  <button class="nav-mobile-login" onclick="window.location.href='/pages/login.html'">Client Login</button>
</div>

<div class="page active">
  <div class="login-wrap">
    <div class="login-box">

      <div id="stepReset">
        <div class="login-logo">NEXUS<span>SEC</span></div>
        <div class="login-title">Set New Password</div>
        <div class="login-sub">Choose a strong password — at least 8 characters.</div>

        <div id="resetError" style="display:none;background:rgba(201,126,126,0.08);border:1px solid rgba(201,126,126,0.2);border-radius:8px;padding:12px 16px;font-size:13px;color:#c97e7e;margin:16px 0"></div>

        <div class="form-group" style="margin-top:24px;position:relative">
          <label>New Password</label>
          <input id="newPass" type="password" placeholder="At least 8 characters" autocomplete="new-password" />
        </div>

        <div class="form-group" style="position:relative">
          <label>Confirm Password</label>
          <input id="confirmPass" type="password" placeholder="Re-enter password" autocomplete="new-password" />
        </div>

        <button class="login-btn" onclick="handleReset()" style="margin-top:8px">Update Password →</button>
      </div>

      <div id="stepDone" style="display:none;text-align:center">
        <div style="font-size:48px;margin-bottom:16px">✅</div>
        <div class="login-title">Password Updated</div>
        <div class="login-sub" style="margin-top:8px">Your password has been changed. All other sessions have been signed out for your security.</div>
        <button onclick="showPage('login')" class="btn-primary" style="margin-top:28px;width:100%">Go to Login →</button>
      </div>

      <div id="stepInvalid" style="display:none;text-align:center">
        <div style="font-size:48px;margin-bottom:16px">⏱️</div>
        <div class="login-title">Link Expired</div>
        <div class="login-sub" style="margin-top:8px">This reset link has expired or already been used. Reset links are valid for 15 minutes.</div>
        <button onclick="window.location.href='/pages/forgot-password.html'" class="btn-primary" style="margin-top:28px;width:100%">Request New Link →</button>
      </div>

    </div>
  </div>
</div>

<div id="toast" style="display:none;position:fixed;bottom:32px;right:32px;background:#ffffff;border:1px solid #ebe3d7;border-radius:10px;padding:14px 20px;font-size:13px;color:#33302b;z-index:9999;box-shadow:0 8px 30px rgba(60,50,35,0.10);font-family:'DM Sans',sans-serif;max-width:320px;animation:fadeUp 0.3s ease"></div>

<script src="../js/script.js"></script>
<script>
// Extract token from URL
const _resetToken = new URLSearchParams(window.location.search).get('token');
if (!_resetToken) {
  document.getElementById('stepReset').style.display   = 'none';
  document.getElementById('stepInvalid').style.display = 'block';
}

async function handleReset() {
  const pass    = document.getElementById('newPass').value;
  const confirm = document.getElementById('confirmPass').value;
  const errEl   = document.getElementById('resetError');
  errEl.style.display = 'none';

  if (pass.length < 8) {
    errEl.textContent = 'Password must be at least 8 characters.';
    errEl.style.display = 'block'; return;
  }
  if (pass !== confirm) {
    errEl.textContent = 'Passwords do not match.';
    errEl.style.display = 'block'; return;
  }

  const btn = document.querySelector('.login-btn');
  btn.textContent = 'Updating…'; btn.disabled = true;

  try {
    const res  = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: _resetToken, password: pass }),
    });
    const json = await res.json();

    if (!res.ok) {
      if (res.status === 400) {
        document.getElementById('stepReset').style.display   = 'none';
        document.getElementById('stepInvalid').style.display = 'block';
      } else {
        errEl.textContent = json.error;
        errEl.style.display = 'block';
      }
      return;
    }

    document.getElementById('stepReset').style.display = 'none';
    document.getElementById('stepDone').style.display  = 'block';
  } catch (e) {
    errEl.textContent = e.message;
    errEl.style.display = 'block';
  } finally {
    btn.textContent = 'Update Password →'; btn.disabled = false;
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') handleReset();
});
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('../sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
