name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Fail only on high/critical advisories so routine low-severity disclosures
      # don't block unrelated PRs (Dependabot handles the routine bumps).
      - run: npm audit --omit=dev --audit-level=high
